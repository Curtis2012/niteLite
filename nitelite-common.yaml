esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # First-ever boot: force default color/brightness, then let normal
  # light restore (last known state) take over on subsequent reboots.
  on_boot:
    priority: -100
    then:
      - if:
          condition:
            lambda: 'return !id(nitelite_initialized);'
          then:
            - light.turn_on:
                id: nitelite_light
                red: 100%
                green: 100%
                blue: 100%
                brightness: 50%
            - lambda: 'id(nitelite_initialized) = true;'

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: arduino

# Enable logging
logger:

# Diagnostics: periodic free-heap/loop-time/reset-reason logging to help
# isolate the freeze after boot (temporary, remove once resolved).
debug:
  update_interval: 5s

# Enable local MQTT broker (Home Assistant MQTT integration + discovery)
mqtt:
  broker: !secret mqtt_broker
  discovery: true
  # Bake the MAC into each entity's discovery unique_id so cloning this
  # config onto multiple physical boards doesn't collide in HA's entity registry.
  discovery_unique_id_generator: mac

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

globals:
  # Persists across reboots (ESPHome flash preferences) so the
  # "default white" initialization only happens once, ever.
  - id: nitelite_initialized
    type: bool
    restore_value: true
    initial_value: 'false'

# Duration (seconds) each color is shown while the "Random Color" effect is active.
number:
  - platform: template
    name: "NiteLite Random Interval"
    id: random_interval
    icon: mdi:timer-outline
    min_value: 1
    max_value: 300
    step: 1
    initial_value: 10
    unit_of_measurement: "s"
    optimistic: true
    restore_value: true

# Photocell exposed as a plain sensor; HA decides on/off/scheduling.
sensor:
  - platform: adc
    pin: GPIO35
    name: "NiteLite Photocell"
    id: photocell
    attenuation: 11db
    raw: true
    update_interval: 30s

# 4-pin RGB LED (3 color legs + common cathode/anode) on 3 PWM-capable
# GPIOs. Adjust `inverted: true` per channel if using a common-anode LED
# instead of common-cathode.
output:
  - platform: ledc
    id: output_red
    pin: GPIO16
  - platform: ledc
    id: output_green
    pin: GPIO17
  - platform: ledc
    id: output_blue
    pin: GPIO18

light:
  - platform: rgb
    name: "NiteLite"
    id: nitelite_light
    red: output_red
    green: output_green
    blue: output_blue
    default_transition_length: 1s
    restore_mode: RESTORE_DEFAULT_ON
    effects:
      - lambda:
          name: "Random Color"
          update_interval: 1s
          lambda: |-
            static uint32_t last_change = 0;
            uint32_t now = millis();
            uint32_t interval_ms = (uint32_t) (id(random_interval).state * 1000);
            if (now - last_change >= interval_ms) {
              last_change = now;
              auto call = id(nitelite_light).turn_on();
              call.set_rgb(
                (float) random(0, 255) / 255.0f,
                (float) random(0, 255) / 255.0f,
                (float) random(0, 255) / 255.0f
              );
              call.set_transition_length(1000);
              call.perform();
            }
